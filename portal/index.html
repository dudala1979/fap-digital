<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAP Faculty Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=0.4.6">
</head>
<body>
<header class="topbar" id="topbar" hidden>
  <div class="brand">
    <img id="clogo" class="clogo" alt="" hidden>
    <span class="logo" id="flogo" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg>
    </span>
    <span><strong>FAP Portal</strong><small id="who"></small></span>
  </div>
  <nav class="tabs" aria-label="Main">
    <a href="#/" data-tab="home">Review queue</a>
    <a href="#/students" data-tab="students">Students</a>
    <a href="#/referrals" data-tab="referrals">Referrals</a>
    <a href="#/overview" data-tab="overview" id="tabOverview" hidden>College overview</a>
    <a href="#/analytics" data-tab="analytics" id="tabAnalytics" hidden>Analytics</a>
    <a href="#/manage" data-tab="manage" id="tabManage" hidden>Manage</a>
    <a href="#/password" data-tab="password">My password</a>
  </nav>
  <button type="button" class="btn ghost" id="signOut">Sign out</button>
</header>
<main id="app" class="wrap"><p class="muted">Loading…</p></main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h2 id="dlgTitle">Return to student</h2>
    <p class="muted" id="dlgHelp">Tell the student exactly what to correct. They will see this note.</p>
    <label for="dlgText" class="lbl">Note</label>
    <textarea id="dlgText" rows="4" required></textarea>
    <div class="row end">
      <button type="button" class="btn ghost" id="dlgCancel">Cancel</button>
      <button type="submit" class="btn" id="dlgOk">Send</button>
    </div>
  </form>
</dialog>
<footer class="foot"><span id="credit"></span><br>FAP Digital Health · Faculty and HOD portal · <span id="ver"></span></footer>
<script type="module" src="app.js?v=0.4.6"></script>
</body>
</html>
